    <text x="71.0" y="86" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a0a8">68 games in 7 kinds,</text>
    <text x="71.0" y="104" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" fill="#a0a0a8">or tonight's special</text>
  </g>
