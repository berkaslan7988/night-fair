    <text x="71.0" y="60" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#161618">Pick a booth</text>
    <text x="71.0" y="86" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5d5d65">68 games in 7 kinds,</text>
    <text x="71.0" y="104" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5d5d65">or tonight's special</text>
  </g>
<line x1="229.0" y1="76.0" x2="251.0" y2="76.0" stroke="#8b8b93" stroke-width="2" marker-end="url(#arr)"/>

